# Controlled feature tags (Plan 2, Task 3). Each tag has a rule that derives it from data.
# poi_near: a POI of one of `kinds` within `within_m` of the trail (trail_pois).
# share_at_least / share_at_most: share of trail length per surface/way_type class.
# A missing share (null) never grants a tag.
- id: "feature:aussicht"
  label: Aussicht
  label_en: Viewpoint
  category: feature
  synonyms: [Ausblick, Panorama, Fernsicht, Aussichtspunkt, Weitblick]
  synonyms_en: [view, scenic view, vista, panorama, lookout, lookout point, scenic viewpoint, outlook]
  rule: {type: poi_near, kinds: [viewpoint], within_m: 300}
- id: "feature:gipfel"
  label: Gipfel
  label_en: Summit
  category: feature
  synonyms: [Berg, Bergspitze, Gipfelkreuz, Gipfelblick]
  synonyms_en: [peak, mountain top, mountaintop, summit cross, summit view]
  rule: {type: poi_near, kinds: [peak], within_m: 300}
- id: "feature:wasserfall"
  label: Wasserfall
  label_en: Waterfall
  category: feature
  synonyms: [Wasserfaelle, Kaskade]
  synonyms_en: [waterfalls, cascade, falls]
  rule: {type: poi_near, kinds: [waterfall], within_m: 300}
- id: "feature:einkehr"
  label: Einkehr
  label_en: Inn
  category: feature
  synonyms: [Gasthaus, Huette, Wirtschaft, Restaurant, Gaststaette, Rast, Vesper]
  synonyms_en: [pub, tavern, restaurant, guesthouse, mountain hut, hut, refreshments, cafe, food stop, place to eat]
  rule: {type: poi_near, kinds: [food, hut], within_m: 300}
- id: "feature:bahnhof"
  label: Bahnhof
  label_en: Railway station
  category: feature
  synonyms: [Bahn, Zug, Oepnv, Anreise mit der Bahn, Haltestelle]
  synonyms_en: [train, railway, train station, railway station, public transport, rail, bus stop, arrive by train]
  rule: {type: poi_near, kinds: [station], within_m: 300}
- id: "feature:rundweg"
  label: Rundweg
  label_en: Round walk
  category: feature
  synonyms: [Rundtour, Rundwanderung, Rundkurs, Runde]
  synonyms_en: [circular walk, circular route, circular trail, round trip, round hike, loop, circuit]
  rule: {type: attribute, roundtrip: true}
- id: "surface:wenig_asphalt"
  label: Wenig Asphalt
  label_en: Little tarmac
  category: surface
  synonyms: [kaum Asphalt, ohne Asphalt, wenig Teer, abseits von Strassen]
  synonyms_en: [little asphalt, no asphalt, hardly any tarmac, off road, away from roads]
  rule: {type: share_at_most, field: surface, keys: [paved], share: 0.2}
- id: "surface:naturweg"
  label: Naturweg
  label_en: Natural path
  category: surface
  synonyms: [Pfad, Wanderpfad, Trampelpfad, Naturpfad, schmale Wege]
  synonyms_en: [path, footpath, hiking path, narrow paths, natural trail, natural path, single track]
  rule: {type: share_at_least, field: way_type, keys: [path], share: 0.4}
- id: "surface:gut_laufbar"
  label: Gut laufbar
  label_en: Good paths
  category: surface
  synonyms: [gut begehbar, bequem, fester Untergrund, festen Untergrund, guter Untergrund, guten Untergrund, gutem Untergrund, gute Wege, gut ausgebaute Wege, befestigte Wege, kinderwagentauglich, leicht zu gehen]
  synonyms_en: [easy walking, easy going, comfortable, firm ground, good ground, good surface, good paths, good trails, well-made paths, pushchair friendly, buggy friendly, stroller friendly, pram friendly, easy to walk]
  rule: {type: share_at_least, field: surface, keys: [paved, gravel], share: 0.6}
