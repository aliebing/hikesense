# Curated trail definitions. Facts only (place names, order); no text copied.
# Coordinates: town centres from OSM Nominatim; Hark and Wilhelmshöhe from the stage join nodes
# of the OSM stage relations. osm_relation_ids are in walking order (stages 1-9 are shared,
# then the variant relation) and carry the ways directly (relation 62900 is the superroute).
# Pforzheim = OSM 'start' node of relation 48073; Basel = Badischer Bahnhof end of the OSM variant;
# Hinterzarten = vertex of relation 62897 nearest to the village (trail passes ~1 km from centre).
# East variant Basel = end vertex of OSM relation 130310 (its ways stop ~1 km short of the Badischer Bahnhof).
# kind uses the DB values (long_distance | day_hike). source = stage division, geometry_source =
# line geometry. A stage may carry `km:` (official length) once it is curated; none is set yet.
# Uncertain: east variant stage 9 end (Bärental vs Hinterzarten, source page is inconsistent).
sources:
  - id: stages-schwarzwald-tourismus
    name: Schwarzwald Tourismus - Westweg Etappeneinteilung (Fakten, keine Texte uebernommen)
    url: https://www.schwarzwald-tourismus.info/erleben/wandern/fernwandern/westweg
    license: Fakten, keine Texte übernommen
    retrieved_at: 2026-10-28
  - id: osm
    name: OpenStreetMap contributors (Overpass API)
    url: https://www.openstreetmap.org/relation/62900
    license: ODbL
    retrieved_at: 2026-10-28
