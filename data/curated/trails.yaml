# Curated trail definitions. Facts only (place names, order); no text copied.
# Coordinates: town centres from OSM Nominatim; Hark and Wilhelmshöhe from the stage join nodes
# of the OSM stage relations. osm_relation_ids are in walking order (stages 1-9 are shared,
# then the variant relation) and carry the ways directly (relation 62900 is the superroute).
# Pforzheim = OSM 'start' node of relation 48073; Basel = Badischer Bahnhof end of the OSM variant;
# Hinterzarten = vertex of relation 62897 nearest to the village (trail passes ~1 km from centre).
# East variant Basel = end vertex of OSM relation 130310 (its ways stop ~1 km short of the Badischer Bahnhof).
# kind uses the DB values (long_distance | day_hike). source = stage division, geometry_source =
# line geometry. A stage may carry `km:` (official length); the Westweg stages have none yet.
# An osm_relation_ids entry may itself be a list of ids: that group is assembled as one piece
# (union of the relations' route ways) before it is chained with the other entries. A trail of
# a single entry is oriented to run from its first stage start.
# Uncertain: east variant stage 9 end (Bärental vs Hinterzarten, source page is inconsistent).
# Mittelweg: relations 56703 (Pforzheim - Lenzkirch) + 1158978 (westliche Variante Lenzkirch -
# Häusern - Waldshut, tagged from=Pforzheim to=Waldshut); 110075 is the superroute. The eastern
# variant 1158977 (Lenzkirch - Rothaus - Waldshut, official 8b/9b) is not curated. Stage places are
# town centres from OSM Nominatim (Zwieselberg = hamlet near Freudenstadt; Kalte Herberge as in the
# Westweg); Pforzheim = end vertex of relation 56703. The Schwarzwaldverein page gives 249 km in
# total, but its stage lengths sum to 233 km; the stage km below are the per-stage values.
# Mittelweg km deviations > 5 % (OSM line vs official, import 2026-10-31) are kept, not hidden:
#   stage 4 Zwieselberg - Schiltach 22.4 vs 25, stage 5 Schiltach - St. Georgen 29.5 vs 31.5,
#   stage 7 Kalte Herberge - Lenzkirch 24.4 vs 26, stage 9 Häusern - Waldshut 23.9 vs 26.5.
# Ostweg: one group [56369 + child relations 17640012, 17640011, 18310287 (Geisingen) and
# 18313354 (Hondingen)]: 56369 alone has two gaps that only these children close. 109884 is the
# superroute; its "Variante Loßburg" (302255) is not curated. The OSM line reaches lon 8.79 near
# Bad Liebenzell (import bbox east = 8.80). Stage places from OSM Nominatim; Sunthausen = vertex of
# the line nearest the village (centre ~640 m off the trail). Stage names shortened from the
# Schwarzwaldverein's "VS-Villingen" / "Bad Dürrheim-Sunthausen". Schaffhausen is in Switzerland;
# the lodging data covers Baden-Württemberg only.
# Ostweg km deviations > 5 % (OSM line vs official, import 2026-10-31) are kept, not hidden:
#   stage 5 Freudenstadt - Alpirsbach 16.7 vs 22.5, 6 Alpirsbach - Schramberg 20.5 vs 19,
#   7 Schramberg - Villingen 29.1 vs 26.5, 8 Villingen - Sunthausen 18.4 vs 16.5,
#   9 Sunthausen - Geisingen 16.9 vs 16, 11 Achdorf - Stühlingen 15.0 vs 18,
#   12 Stühlingen - Schaffhausen 19.8 vs 18.5. Total 244.5 km vs 246 km official.
# Cause: where the stage ends are placed on the line, not a shorter route — stages 5-7 together are
# only 2.7 % off (66.2 vs 68 km).
# Every Ostweg stage has lodgings within 1 km (import 2026-10-31; stage 9 only 5). Swiss side of
# stage 12 has none (BW-only lodging data).
# Stage 3 (2026-11-02), Palatinate and Lake Constance. Stage places: town centres from OSM Nominatim
# (1 request/s); where the centre is > 500 m off the OSM line the nearest line vertex is used
# instead: Bockenheim (line start; centre 950 m off), Schopp (Nominatim only gives the municipality
# centroid, 2.3 km off), Heltersberg, Hauenstein, Konstanz (SeeGang start), Sipplingen and
# Überlingen (Jubiläumsweg end; centre 1.1 km off).
# Pfälzer Weinsteig: osm_relation_ids are the 11 stage relations in walking order (member order of
# superroute 15761992); the Zuweg relations are not curated. Official total on the source page is
# 172 km but its 11 stage lengths sum to 184 km (OSM 178.8 km); the per-stage km are used.
# Weinsteig km deviations > 5 % (OSM line vs official, import 2026-11-02) are kept, not hidden:
#   stage 7 Burrweiler - Dernbach 13.9 vs 17.2: relation 3286359 contains a ~3.2 km loop near
#   Burrweiler that cannot be chained into the line; the assembler drops it (reported as warning),
#   stage 11 Bad Bergzabern - Schweigen-Rechtenbach 15.0 vs 16.
# Pfälzer Waldpfad: OSM relation 1650025 starts in Kaiserslautern, ~14 km before Schopp; the line is
# cut at Schopp (first stage start) and at Schweigen-Rechtenbach (trails length = sum of stages).
# The OSM line has T-junctions without shared vertices and parallel variants; the assembler falls
# back to the shortest path (9 small pieces, 355 m, dropped). Official total 129.1 km, stage sum 130.2.
# Waldpfad km deviation > 5 %: stage 1 Schopp - Johanniskreuz 12.5 vs 15.3 (the OSM line does not
# pass the official start section; Schopp is the nearest vertex of the line).
# Jubiläumsweg Bodenseekreis: km are "ca." values (official total 111 km, stage sum 120 km, OSM
# 115 km). Deviations > 5 % (import 2026-11-02): stage 1 17.5 vs 20, stage 3 21.9 vs 20,
# stage 4 20.3 vs 22, stage 5 18.9 vs 20, stage 6 18.7 vs 20; total 115 km vs 120 km.
# SeeGang: stage km come from wildganz.com and are NOT officially confirmed (only the end points
# are confirmed by seen.de). Deviations > 5 %: stage 2 Wallhausen - Bodman 16.8 vs 18.9,
# stage 3 Bodman - Sipplingen 7.8 vs 7.4; total 52.9 km (OSM) vs 55.6 km (sum of stage km).
