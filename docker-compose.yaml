services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_DB_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data

  # Next.js dev server. Server components fetch Supabase via SUPABASE_URL
  # (host.docker.internal, resolvable only inside the container); anything
  # running in the browser must use NEXT_PUBLIC_SUPABASE_URL (localhost).
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
