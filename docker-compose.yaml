services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_DB_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
      # optional LangSmith tracing (off unless LANGSMITH_TRACING=true and a key are set in .env)
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-hikesense}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data

  # Next.js dev server. Server components fetch Supabase via SUPABASE_URL
  # (host.docker.internal, resolvable only inside the container). The browser
  # only talks to :3000: next.config.ts proxies /sb/* to SUPABASE_URL and
  # /api/chat to API_INTERNAL_URL, so one tunnel to :3000 serves the phone.
  # The NEXT_PUBLIC_* URLs are blanked so a value in .env cannot bypass that.
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
