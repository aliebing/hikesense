[project]
name = "hikeall"
version = "0.1.0"
description = "Hike all about: chat-first Black Forest hiking planner"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tifffile>=2026.9.20",
    "imagecodecs>=2026.8.16",
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.6.0",
    "osmium>=4.3.2",
    "pyjwt[crypto]>=2.15.1",
    "beautifulsoup4>=4.15.0",
    "protego>=0.7.0",
    "langsmith>=0.14.15,<1",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
hikeall = "hikeall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hikeall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a running Supabase/Postgres (SUPABASE_DB_URL)"]

[tool.ruff]
line-length = 100
